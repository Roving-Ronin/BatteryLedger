version: 2
updates:
  # Keep GitHub Actions used by the workflows up to date
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  # Keep the test requirements (pytest-homeassistant-custom-component etc.) up to date
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
